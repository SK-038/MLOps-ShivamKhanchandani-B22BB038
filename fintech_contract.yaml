# DATA CONTRACT: Real-Time Transaction Log for Fraud Detection
# NEGOTIATION SUMMARY
# Producer: Core Banking Transactions Platform (core-tx@securebank.com)
# Consumer: Fraud Detection & Monitoring Team (fraud-ml@securebank.com)

# Agreed Terms:
# - Source and destination account IDs exposed as logical fields with strict format rules.
# - account_source_id must be exactly 10 uppercase alphanumeric characters (A-Z, 0-9).
# - Any violation of the account_source_id pattern triggers a HARD CIRCUIT BREAKER: offending records are rejected and the pipeline is blocked until corrected.
# - This strict enforcement is required to avoid silent lookup failures in fraud models.

dataContractSpecification: 0.9.3
id: urn:datacontract:securebank:fraud-tx-log
version: 1.0.0

info:
  title: "Bank Transaction Log for Real-Time Fraud Detection"
  description: |
    Streaming transaction log containing source and destination account identifiers
    and timestamps for fraud detection models and rules engines.
  owner: "Fraud Data Engineering"
  contact:
    name: "Fraud Data Steward"
    email: "fraud-data@securebank.com"
    slack: "#fraud-data"
  classification: confidential
  tags: [fintech, transactions, fraud, realtime]

schema:
  type: object
  properties:
    account_source_id:
      type: string
      pattern: "^[A-Z0-9]{10}$"
      description: |
        Source account identifier. Must be exactly 10 characters long,
        consisting only of uppercase letters A-Z and digits 0-9.
        Example valid: ABCD123456, 1234567890, A1B2C3D4E5.
      pii: true
      # physical_mapping: acct_src

    account_destination_id:
      type: string
      pattern: "^[A-Z0-9]{10}$"
      description: |
        Destination account identifier with the same 10-character uppercase
        alphanumeric format as the source account.
      pii: true
      # physical_mapping: acct_dest

    transaction_timestamp:
      type: string
      format: date-time
      description: "Timestamp when the transaction was created in the core banking system."
      pii: false
      # physical_mapping: tx_ts

  required:
    - account_source_id
    - account_destination_id
    - transaction_timestamp

sla:
  freshness:
    threshold: "5 seconds"
    description: "Transactions must be available to fraud systems within seconds of creation."
  availability:
    percentage: "99.9%"
    description: "High availability required for real-time fraud detection."
  retention:
    period: "5 years"
    description: "Retention aligned with financial regulations and fraud investigations."

quality:
  - name: account_source_id_pattern
    type: validity
    expression: "REGEXP_LIKE(account_source_id, '^[A-Z0-9]{10}$')"
    threshold: "100%"
    enforcement: hard
    description: |
      HARD CIRCUIT BREAKER: Source account ID must be exactly 10 uppercase
      alphanumeric characters. Any violation blocks the pipeline and triggers alerts.
