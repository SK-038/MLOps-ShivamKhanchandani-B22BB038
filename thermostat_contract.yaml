# DATA CONTRACT: Smart Thermostat Telemetry
# NEGOTIATION SUMMARY
# Producer: IoT Ingestion Platform (iot-platform@homeclimate.com)
# Consumer: Home Climate Analytics Team (analytics@homeclimate.com)

# Agreed Terms:
# - Fleet of ~10,000 thermostats sending minute-level telemetry.
# - Temperature readings constrained to a realistic range [-30, 60] °C.
# - Battery level must be a percentage in [0.0, 1.0] inclusive.
# - Out-of-range readings (e.g., 9999°C) represent sensor failure and are hard-rejected to protect average temperature metrics and downstream alerting.

dataContractSpecification: 0.9.3
id: urn:datacontract:homeclimate:thermostat-telemetry
version: 1.0.0

info:
  title: "Smart Thermostat Temperature and Battery Telemetry"
  description: |
    Telemetry feed from connected thermostats including device identifier,
    ambient temperature in Celsius, and battery level as a fraction between 0.0 and 1.0.
  owner: "IoT Data Engineering"
  contact:
    name: "IoT Data Steward"
    email: "iot-data@homeclimate.com"
    slack: "#iot-telemetry"
  classification: internal
  tags: [iot, thermostat, telemetry, temperature]

schema:
  type: object
  properties:
    device_id:
      type: string
      description: "Unique identifier of the thermostat device."
      pii: false
      # physical_mapping: dev_id

    temperature_celsius:
      type: number
      description: "Ambient temperature reported by the thermostat in degrees Celsius."
      pii: false
      # physical_mapping: temp_c

    battery_level:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: |
        Battery charge level as a fraction between 0.0 (empty) and 1.0 (full),
        inclusive of the boundary values.
      pii: false
      # physical_mapping: batt_lvl

  required:
    - device_id
    - temperature_celsius
    - battery_level

sla:
  freshness:
    threshold: "5 minutes"
    description: "Telemetry must be available within 5 minutes of capture."
  availability:
    percentage: "99.0%"
    description: "Telemetry pipeline uptime target."
  retention:
    period: "30 days"
    description: "Short-term retention for operational analytics."

quality:
  - name: temperature_realistic_range
    type: validity
    expression: "temperature_celsius >= -30 AND temperature_celsius <= 60"
    threshold: "100%"
    enforcement: hard
    description: "Reject unrealistic temperature readings outside [-30, 60] °C."

  - name: battery_level_fraction_range
    type: validity
    expression: "battery_level >= 0.0 AND battery_level <= 1.0"
    threshold: "100%"
    enforcement: hard
    description: "Battery level must be in [0.0, 1.0] inclusive (0.0 and 1.0 are valid)."
